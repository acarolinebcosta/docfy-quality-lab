name: Backend API Tests

on:
  pull_request:
    paths:
      - ".github/workflows/backend-api-tests.yml"
      - ".github/scripts/backend-api/**"
      - "tests/backend-api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-api-tests.yml"
      - ".github/scripts/backend-api/**"
      - "tests/backend-api/**"
  workflow_dispatch:
    inputs:
      docfy_ref:
        description: Branch, tag or commit from acarolinebcosta/Docfy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-api:
    name: REST Assured regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: docfy_ci
          POSTGRES_USER: docfy_ci
          POSTGRES_PASSWORD: docfy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docfy_ci -d docfy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOCFY_API_BASE_URL: http://localhost:8080
      DOCFY_HTTP_TIMEOUT_MS: 10000
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/docfy_ci
      DB_USER: docfy_ci
      DB_PASSWORD: docfy_ci
    steps:
      - name: Checkout quality lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Docfy system under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: acarolinebcosta/Docfy
          ref: ${{ inputs.docfy_ref || 'main' }}
          path: .sut/docfy

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            tests/backend-api/pom.xml
            .sut/docfy/backend/pom.xml

      - name: Generate ephemeral application credentials
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          seed_password="$(openssl rand -hex 24)"

          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$seed_password"
          echo "Ephemeral CI credentials registered for masking."

          {
            echo "JWT_SECRET=$jwt_secret"
            echo "DOCFY_DEV_SEED_PASSWORD=$seed_password"
            echo "DOCFY_TEST_PASSWORD=$seed_password"
          } >> "$GITHUB_ENV"

      - name: Capture tested revisions
        id: revisions
        shell: bash
        run: |
          echo "quality_lab_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "docfy_sha=$(git -C .sut/docfy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start Docfy backend
        working-directory: .sut/docfy/backend
        shell: bash
        env:
          DOCFY_FILE_STORAGE_PATH: ${{ runner.temp }}/docfy-files
        run: |
          nohup ./mvnw --batch-mode spring-boot:run > backend.log 2>&1 &

      - name: Wait for Docfy readiness
        shell: bash
        run: |
          for _attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 .sut/docfy/backend/backend.log
          exit 1

      - name: Run Backend API quality gates
        id: quality_gates
        working-directory: tests/backend-api
        run: ./mvnw --batch-mode verify

      - name: Publish quality gate summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.quality_gates.outcome }}
          QUALITY_LAB_SHA: ${{ steps.revisions.outputs.quality_lab_sha }}
          DOCFY_SUT_SHA: ${{ steps.revisions.outputs.docfy_sha }}
          CI_ENVIRONMENT: GitHub Actions / ubuntu-latest
        run: |
          export JAVA_VERSION
          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"
          python3 .github/scripts/backend-api/generate_evidence.py
          cat tests/backend-api/target/backend-api-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify evidence contains no ephemeral credentials
        id: evidence_safety
        if: always()
        shell: bash
        run: |
          evidence_paths=(
            "tests/backend-api/target/surefire-reports"
            "tests/backend-api/target/allure-results"
            "tests/backend-api/target/backend-api-summary.md"
            ".sut/docfy/backend/backend.log"
          )
          available_paths=()

          for evidence_path in "${evidence_paths[@]}"; do
            if [[ -e "$evidence_path" ]]; then
              available_paths+=("$evidence_path")
            fi
          done

          if [[ ${#available_paths[@]} -eq 0 ]]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          evidence_is_safe=true
          for sensitive_value in "$JWT_SECRET" "$DOCFY_DEV_SEED_PASSWORD" "$DOCFY_TEST_PASSWORD"; do
            if [[ -n "$sensitive_value" ]] \
              && grep --recursive --binary-files=text --fixed-strings --quiet \
                -- "$sensitive_value" "${available_paths[@]}"; then
              evidence_is_safe=false
            fi
          done

          echo "safe=$evidence_is_safe" >> "$GITHUB_OUTPUT"
          if [[ "$evidence_is_safe" != "true" ]]; then
            echo "::error::Sensitive ephemeral value detected; evidence upload blocked."
            exit 1
          fi

      - name: Upload test evidence
        if: always() && steps.evidence_safety.outputs.safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-api-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/backend-api/target/surefire-reports/
            tests/backend-api/target/allure-results/
            tests/backend-api/target/backend-api-summary.md
            .sut/docfy/backend/backend.log
